server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: xiaozhan-server
  profiles:
    active: dev

  servlet:
    multipart:
      enabled: true
      max-file-size: 1024MB
      max-request-size: 1024MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xiaozhan.entity
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ============ 业务自定义配置 ============
xiaozhan:
  # JWT 配置
  jwt:
    # 生产环境请务必替换为随机密钥（>= 32 字节）
    secret: xiaozhan-portfolio-capability-endorsement-platform-secret-key-2026
    # token 有效期（毫秒），默认 7 天
    expire: 604800000
    header: Authorization
    prefix: "Bearer "
  # 文件上传配置
  upload:
    # 本地磁盘存储根目录（Windows 示例 D:/xiaozhan-files；Linux 示例 /data/xiaozhan-files）
    base-path: ./files
    # 访问 URL 前缀
    url-prefix: /files
    # 单文件最大体积（字节）— 与 multipart 保持一致
    max-video-size: 1073741824
    max-doc-size: 104857600
    max-source-size: 524288000
  # 点评规则
  review:
    # 评语最少字数
    min-comment-length: 50
    # 专家每日点评上限
    expert-daily-limit: 20
    # 同一专家对同一学生 30 天内只能点评一次
    duplicate-days: 30
    # 求点评池未被认领时，超过该小时数自动提高曝光权重
    pool-boost-hours: 72
    # 超过该天数无人点评则退回学生
    pool-expire-days: 7
  # 企业额度
  company:
    free-month-quota: 20

# ============ 开发环境 ============
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xiaozhan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # password:
      timeout: 3000ms

knife4j:
  enable: true
  setting:
    language: zh_cn

# ============ 生产环境 ============
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:xiaozhan}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

knife4j:
  enable: false
